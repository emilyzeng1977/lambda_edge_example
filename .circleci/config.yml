version: 2.1

jobs:
  plan:
    docker:
      - image: devopsinfra/docker-terragrunt:latest
    steps:
      - checkout
      - run:
          name: Terragrunt Plan
          command: |
            cd infra/environments/develop/s3
            terragrunt run-all plan --terragrunt-non-interactive

  apply:
    docker:
      - image: devopsinfra/docker-terragrunt:latest
    steps:
      - checkout
      - run:
          name: Terragrunt Apply
          command: |
            cd infra/environments/develop/s3
            terragrunt run-all apply --terragrunt-non-interactive

workflows:
  version: 2
  deploy:
    jobs:
      - plan
      - hold-apply:
          type: approval
          requires:
            - plan
      - apply:
          requires:
            - hold-apply
